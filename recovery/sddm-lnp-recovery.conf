# Installed as a drop-in for the display manager by lnp-recovery -- both
# sddm.service and plasmalogin.service (Fedora 44 KDE ships the Plasma Login
# Manager; older installs ship SDDM; the drop-in for the absent one is inert).
#
# When the display manager gives up (its own restart limit exhausted), show
# the plain-language recovery prompt on the console instead of leaving a
# black screen and a stranded person.
[Unit]
OnFailure=lnp-recovery-prompt.service
